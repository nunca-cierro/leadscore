rules:
  proposal:
    - Scope to SPEC.md §1 (V1) only; §9 roadmap items are explicitly out of scope for V1.
    - Include rollback plan for risky changes (schema or data-migration changes).
    - Respect delivery strategy ask-always: stop and ask if the forecast exceeds 400 review-budget lines.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Align with docs/SPEC.md contracts (§3 schema, §4 API table, §5 UI).
  design:
    - Document architecture decisions with rationale (stack is fixed by SPEC.md §2; no substitutions).
    - Include sequence diagrams for complex flows (drag & drop optimistic PATCH, import flow).
  tasks:
    - Group by phase per SPEC.md §8 (Fase 0–4), use hierarchical numbering.
    - Keep tasks completable in one session.
    - Never substitute forbidden tech: Prisma, Redux/Zustand.
  apply:
    guidelines:
      - Follow existing code patterns; TypeScript strict mode at all times.
      - Validate every API route and form with the shared zod schema (lib/schemas/lead.ts).
      - Re-run strict_tdd resolution once vitest lands (Fase 1) with a workspace-level test command.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
