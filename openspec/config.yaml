schema: spec-driven

context: |
  Project: leadscore — CRM de prospección con scoring automático (V1 internal use for nuncacierro).
  Spec source of truth: docs/SPEC.md (278 lines, Spanish).
  Stack: Next.js 14+ App Router + TypeScript strict + Tailwind CSS + @dnd-kit/core + Postgres (self-hosted en Hetzner) + auth de sesión propia + self-hosted Hetzner (Docker Compose + Caddy) + zod.
  Architecture: Route Handlers under /app/api/*, no separate server; shared zod schema in lib/schemas/lead.ts. Forbidden: Prisma, Redux/Zustand.
  Testing: no runner installed yet — vitest arrives in Fase 1, playwright in Fase 4 (SPEC.md §8).
  Discovered projects: none (Next.js scaffold does not exist yet; Fase 0 runs next).
  Persistence mode: openspec (file artifacts). Delivery strategy: ask-always (stop if forecast exceeds 400 review-budget lines).

strict_tdd: false

